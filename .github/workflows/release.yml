      # - uses: actions/upload-artifact@v4
        # with:
          # name: pico-macos
          # path: pico-macos.zip

  release:
    if: github.event_name == 'push'
    needs: [linux, windows] # [linux, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: docs/releases
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          repo=$GITHUB_REPOSITORY
          version=v$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if gh release view "$version" --repo "$repo" > /dev/null 2>&1; then
            echo "$version is already released; updating latest only."
          else
            notes=docs/releases/$version.md
            if [ -f "$notes" ]; then notes=(--notes-file "$notes"); else notes=(--generate-notes); fi
            gh release create "$version" dist/* --repo "$repo" --target "$GITHUB_SHA" \
              --title "Pico $version" "${notes[@]}" --latest
          fi
          gh release delete latest --repo "$repo" --cleanup-tag --yes || true
          gh release create latest dist/* --repo "$repo" --target "$GITHUB_SHA" \
            --title "Pico (latest main)" --notes "Built from $GITHUB_SHA." --prerelease --latest=false
