        # run: |
          # cargo build --release --locked -p pico --target aarch64-apple-darwin
          # cargo build --release --locked -p pico --target x86_64-apple-darwin
      # - name: Package
        # run: |
          # version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "pico") | .version')
          # app=Pico.app/Contents
          # mkdir -p "$app/MacOS"
          # lipo -create -output "$app/MacOS/pico" \
            # target/aarch64-apple-darwin/release/pico target/x86_64-apple-darwin/release/pico
          # sed "s/@VERSION@/$version/g" packaging/macos/Info.plist > "$app/Info.plist"
