[workspace]
resolver = "3"
members = ["crates/pico-core", "crates/pico"]

[workspace.package]
version = "0.6.0"
edition = "2024"
license = "Apache-2.0"

[profile.release]
lto = "thin"
strip = true

# Image decoding and resizing are many times slower unoptimized; build
# dependencies with optimizations even in debug, so tests and `cargo run` stay
# quick while Pico's own code stays easy to debug.
[profile.dev.package."*"]
opt-level = 2

# The photo filters too: an edited photo would otherwise take seconds to show
# in a debug build. Pico's interface code stays unoptimized for debugging.
[profile.dev.package.pico-core]
opt-level = 2
