  release:
    if: github.event_name == 'push'
    needs: [linux] # [linux, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt
      # A push to main replaces the `latest` release; a `v*` tag gets its own.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "Pico $GITHUB_REF_NAME" --generate-notes
          else
            gh release delete latest --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
            gh release create latest dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "Pico (latest main)" --notes "Built from $GITHUB_SHA." --latest
          fi
