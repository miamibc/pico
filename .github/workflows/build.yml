# Builds and tests Picco on Linux, Windows and macOS, and keeps the binaries
# as downloadable artifacts. macOS can only be built on a Mac, hence CI.
name: build

# Automatic runs are off for now to save Actions minutes (release.yml builds
# Linux x86_64 on every push to main); run by hand or uncomment the triggers.
on:
  # push:
  # pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            binary: target/release/picco
          - os: windows-latest
            binary: target/release/picco.exe
          - os: macos-latest # Apple Silicon
            binary: target/release/picco
          - os: macos-15-intel
            binary: target/release/picco
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Lint
        run: |
          cargo fmt --all --check
          cargo clippy --all-targets -- -D warnings
      - name: Core tests
        run: cargo test -p picco-core
      - name: Build
        run: cargo build --release -p picco
      - uses: actions/upload-artifact@v4
        with:
          name: picco-${{ matrix.os }}
          path: ${{ matrix.binary }}
