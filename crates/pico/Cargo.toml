[package]
name = "pico"
description = "Pico: a small, local photo organizer in the spirit of Picasa 3"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
eframe = "0.37.0"
egui = { version = "0.37.0", features = ["monochrome_emoji_fonts"] }
pico-core = { path = "../pico-core" }
# Puts copied files on the clipboard; eframe already builds it for text.
arboard = { version = "3.7", default-features = false, features = ["wayland-data-control"] }
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }

# Reads the desktop's light or dark preference from the XDG portal; already
# built for the file dialog, so no new crates.
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }

[dev-dependencies]
egui_kittest = { version = "0.37.0", features = ["eframe", "wgpu", "snapshot"] }
