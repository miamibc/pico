# Builds Pico and publishes the archives as a GitHub release. Run by hand
# (Actions > release > Run workflow) to get the archives as artifacts only.
#
# For now only Linux x86_64 and Windows x86_64 are built, once per push to
# main. The archives go to a rolling pre-release tagged `latest`. When the
# version in Cargo.toml has no release yet, the same archives also become
# release `v<version>`, with the notes from docs/releases/v<version>.md
# (English, then Russian); the tag is created on the pushed commit. So a new
# version is: bump it, add its notes, merge. The other systems are commented
# out to save Actions minutes; uncomment them (and the `needs` of the release
# job) to build everything.
#
# Intel and AMD processors share the x86 builds: x86_64 for 64-bit, x86
# (i686) for 32-bit. Linux builds are cross-compiled with cargo-zigbuild
# against glibc 2.28, so they run on distributions from 2019 on; Pico links
# only libc and loads X11/Wayland/GPU libraries at run time.
name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            name: linux-x86_64
          # - target: i686-unknown-linux-gnu
            # name: linux-x86
          # - target: aarch64-unknown-linux-gnu
            # name: linux-arm64
          # - target: armv7-unknown-linux-gnueabihf
            # name: linux-armv7
    runs-on: ubuntu-latest
    steps:
      # The whole history: the build number counts commits (crates/pico/build.rs).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild
      - name: Build
        run: cargo zigbuild --release --locked -p pico --target ${{ matrix.target }}.2.28
      - name: Package
        run: |
          dir=pico-${{ matrix.name }}
          mkdir "$dir"
          cp target/${{ matrix.target }}/release/pico README.md "$dir"/
          tar -czf "$dir.tar.gz" "$dir"
      - uses: actions/upload-artifact@v4
        with:
          name: pico-${{ matrix.name }}
          path: pico-${{ matrix.name }}.tar.gz

  # Windows builds are cross-compiled on Linux too, with cargo-zigbuild and
  # the MinGW (gnu) target, as `make windows` does: Linux runners are faster
  # and cheaper than Windows ones. The .exe needs only Windows 10/11 DLLs.
  windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-gnu
            name: windows-x86_64
          # - target: i686-pc-windows-gnu
            # name: windows-x86
          # - target: aarch64-pc-windows-gnullvm
            # name: windows-arm64
    runs-on: ubuntu-latest
    steps:
      # The whole history: the build number counts commits (crates/pico/build.rs).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild
      - name: Build
        run: cargo zigbuild --release --locked -p pico --target ${{ matrix.target }}
      - name: Package
        run: |
          dir=pico-${{ matrix.name }}
          mkdir "$dir"
          cp target/${{ matrix.target }}/release/pico.exe README.md "$dir"/
          zip -r "$dir.zip" "$dir"
      - uses: actions/upload-artifact@v4
        with:
          name: pico-${{ matrix.name }}
          path: pico-${{ matrix.name }}.zip

  # # One universal app for Apple Silicon and Intel Macs. It is not signed, so
